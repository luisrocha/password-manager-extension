<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Manager</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Password Manager</h1>
      <p id="site" class="site">Detecting current site...</p>

      <form id="locked-section">
        <div id="vault-connect-section" class="vault-setup hidden">
          <p class="section-note">Required to connect this extension with the web app first.</p>
          <button id="open-web-app" type="button" class="secondary-action">Open web app</button>
        </div>

        <label class="master-password">
          Master password
          <input id="master-password" type="password" autocomplete="current-password" />
        </label>

        <div class="auth-actions">
          <button id="unlock" type="submit">Unlock</button>
        </div>

        <div id="totp-challenge-section" class="totp-challenge hidden">
          <label class="totp-code">
            Two-factor code
            <input
              id="totp-code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              autocapitalize="none"
              spellcheck="false"
            />
          </label>
          <label class="remember-client">
            <input id="remember-totp-client" type="checkbox" />
            Do not ask again for 24 hours
          </label>
          <div class="totp-actions">
            <button id="verify-totp" type="button">Continue</button>
            <button id="cancel-totp" type="button" class="secondary-action">Back</button>
          </div>
        </div>
      </form>

      <section id="unlocked-section">
        <div id="credentials-browser-view">
          <form id="credential-search-form" class="credential-search">
            <input
              id="credential-search-input"
              type="search"
              placeholder="Search passwords..."
              autocomplete="off"
            />
          </form>

          <div id="credential-selection" class="credential-selection hidden">
            <label for="credential-select">Choose account</label>
            <select id="credential-select"></select>
          </div>

          <div id="credential-details" class="credential-details hidden">
            <div class="credential-field">
              <label for="selected-username">Username</label>
              <div class="credential-field-actions">
                <input id="selected-username" type="text" readonly />
                <button id="copy-username" type="button" class="field-action icon-action" aria-label="Copy username" title="Copy username"></button>
              </div>
            </div>

            <div class="credential-field">
              <label for="selected-password">Password</label>
              <div class="credential-field-actions">
                <input id="selected-password" type="text" readonly class="masked" />
                <button id="toggle-password" type="button" class="field-action icon-action" aria-label="Show password" title="Show password"></button>
                <button id="copy-password" type="button" class="field-action icon-action" aria-label="Copy password" title="Copy password"></button>
              </div>
            </div>
          </div>

          <button id="fill-now" type="button">Fill credentials</button>
          <button id="edit-credential" type="button" class="secondary-action hidden">Edit</button>
          <button id="add-new-credential" type="button" class="secondary-action">Add new credential</button>

          <fieldset>
            <label>
              <input id="autofill-on-load" type="checkbox" />
              Autofill on page load
            </label>
            <label>
              <input id="allow-http" type="checkbox" />
              Allow autofill on HTTP pages
            </label>
          </fieldset>
        </div>

        <form id="new-credential-form" class="hidden">
          <h2 id="new-credential-title" class="form-title">Add new credential</h2>
          <div class="credential-field">
            <label for="new-credential-name">Name</label>
            <input
              id="new-credential-name"
              type="text"
              autocomplete="off"
              autocapitalize="words"
              spellcheck="false"
            />
          </div>

          <div class="credential-field">
            <label for="new-credential-username">Username</label>
            <input
              id="new-credential-username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
            />
          </div>

          <div class="credential-field">
            <label for="new-credential-password">Password</label>
            <div class="credential-field-actions password-generator-field">
              <input
                id="new-credential-password"
                type="password"
                autocomplete="new-password"
                spellcheck="false"
              />
              <button
                id="toggle-new-credential-password"
                type="button"
                class="field-action icon-action"
                aria-label="Show password"
                title="Show password"
              ></button>
              <button
                id="open-password-generator"
                type="button"
                class="field-action icon-action"
                aria-label="Generate password"
                aria-expanded="false"
                aria-controls="password-generator-popup"
                title="Generate password"
              ></button>
            </div>
            <div id="password-generator-popup" class="password-generator-popup hidden">
              <label class="generator-length">
                Characters
                <span id="password-length-value">20</span>
              </label>
              <input id="password-length" type="range" min="8" max="100" value="20" />
              <label class="generator-option">
                Include numbers
                <input id="password-include-numbers" type="checkbox" checked />
              </label>
              <label class="generator-option">
                Include symbols
                <input id="password-include-symbols" type="checkbox" />
              </label>
              <button id="generate-password" type="button">Generate password</button>
            </div>
          </div>

          <div class="new-credential-actions">
            <button id="save-new-credential" type="submit">Save</button>
            <button id="delete-credential" type="button" class="danger-action hidden">Delete</button>
            <button id="cancel-new-credential" type="button" class="secondary-action">Cancel</button>
          </div>
          <p id="delete-warning" class="delete-warning hidden">Click Delete again to permanently remove this credential.</p>
        </form>
      </section>

      <p id="status" class="status" aria-live="polite"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
